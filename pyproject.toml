[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liyagent-cli"
dynamic = ["version"]
description = "liya — the command line for Liyagent, the governed AI agent platform"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "pyyaml>=6"]

[project.optional-dependencies]
verify = ["cryptography>=42"]

[project.urls]
Homepage = "https://liyagent.com"
Documentation = "https://liyagent.com/docs"
"Try it" = "https://liyagent.com/try"

[project.scripts]
liya = "liya:main"

[tool.setuptools.dynamic]
version = { attr = "liya.__version__" }

[tool.setuptools.packages.find]
include = ["liya*"]
