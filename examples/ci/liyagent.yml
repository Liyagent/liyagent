# Agents as code in GitHub Actions: plan on a pull request, apply on merge.
#
# Copy to .github/workflows/liyagent.yml in the repository that holds your
# Liyagent resources (`liya export -o ./liyagent` writes them: agents,
# providers without their secrets, guardrails, policies and triggers, as YAML).
#
# Credential: a governance service account, not a person's password.
#   1. In Liyagent, Access → Users: add an account with NO password (say
#      `ci-deployer`) and a role holding only what the pipeline needs —
#      agents.get, agents.update, agents.create, policy.create / policy.update.
#   2. POST /api/service-accounts {"name": "github", "account": "ci-deployer",
#      "ttl_days": 90} — the response's client_id and client_secret, shown once.
#   3. Store `svc/github:<client_secret>` as the repository secret LIYA_TOKEN,
#      and the instance URL as the repository variable LIYA_URL.
# It works on an instance where SSO is enforced, is refused if the account is
# given a password or an owner role, and ends when the service account is deleted.
#
# Exit codes: `liya apply --dry-run` exits 5 when changes are pending and 0 when
# the instance already matches; any `liya` command exits 1 on an error or a
# refusal. `liya agents eval` exits 0 on pass and 1 on a failure or regression.

name: liyagent

on:
  pull_request:
    paths: ["liyagent/**"]
  push:
    branches: [main]
    paths: ["liyagent/**"]

permissions:
  contents: read

env:
  LIYA_URL: ${{ vars.LIYA_URL }}
  LIYA_TOKEN: ${{ secrets.LIYA_TOKEN }}

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "git+https://github.com/liyagent/liyagent.git"
      - name: Plan
        # 5 means "this change would modify the instance" — expected on a pull
        # request, so it is reported, not failed. 1 (refused or broken) fails.
        run: |
          set +e
          liya apply -f liyagent --dry-run
          rc=$?
          set -e
          if [ "$rc" -eq 1 ]; then exit 1; fi
      - name: Evaluate the agents this change touches
        # Gate the change on each agent's own eval set against its pinned
        # baseline. List the agent ids your repository manages.
        run: |
          for agent in service-desk hr; do
            liya agents eval "$agent" --baseline pinned
          done

  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production     # a required reviewer, if the environment has one
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "git+https://github.com/liyagent/liyagent.git"
      - name: Apply
        run: liya apply -f liyagent --reason "merged ${{ github.sha }}"
      - name: Drift check
        # After an apply the instance must match the files: 5 here is drift.
        run: liya apply -f liyagent --dry-run
