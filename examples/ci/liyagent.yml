# Manage Liyagent agents as code with GitHub Actions.
#
# On a pull request, the workflow shows the pending changes and runs the agent
# evaluations. On a merge to main, it applies the changes and checks for drift.
#
# Setup
#
# 1. Save this file as .github/workflows/liyagent.yml in the repository that
#    holds your Liyagent configuration. Create that configuration with:
#      liya export -o ./liyagent
#
# 2. Create a service account in Liyagent. Use an account with no password and
#    a role that grants only agents.get, agents.update, agents.create,
#    policy.create and policy.update. Then request a credential:
#      POST /api/service-accounts
#      {"name": "github", "account": "ci-deployer", "ttl_days": 90}
#    The response contains a client secret, which is shown once.
#
# 3. In the GitHub repository settings, add:
#      Secret   LIYA_TOKEN   svc/github:<client secret>
#      Variable LIYA_URL     the address of your Liyagent instance
#
# Exit codes
#
#   liya apply --dry-run   0 when the instance matches the files, 5 when changes are pending
#   liya agents eval       0 when the evaluation passes, 1 when it fails or regresses
#   any liya command       1 on an error or a refusal

name: liyagent

on:
  pull_request:
    paths: ["liyagent/**"]
  push:
    branches: [main]
    paths: ["liyagent/**"]

permissions:
  contents: read

env:
  LIYA_URL: ${{ vars.LIYA_URL }}
  LIYA_TOKEN: ${{ secrets.LIYA_TOKEN }}

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install liya
        run: pip install "git+https://github.com/liyagent/liyagent.git"

      - name: Show pending changes
        # Exit code 5 means changes are pending, which is expected on a pull
        # request. Only exit code 1 fails the job.
        run: |
          set +e
          liya apply -f liyagent --dry-run
          rc=$?
          set -e
          if [ "$rc" -eq 1 ]; then exit 1; fi

      - name: Evaluate the agents
        # Replace the agent IDs with the agents this repository manages.
        run: |
          for agent in service-desk hr; do
            liya agents eval "$agent" --baseline pinned
          done

  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install liya
        run: pip install "git+https://github.com/liyagent/liyagent.git"

      - name: Apply changes
        run: liya apply -f liyagent --reason "Merged ${{ github.sha }}"

      - name: Check for drift
        # After an apply, the instance must match the files. Exit code 5 here
        # means the instance has drifted.
        run: liya apply -f liyagent --dry-run
